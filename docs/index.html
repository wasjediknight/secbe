<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Relatórios / Páginas</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 16px;line-height:1.35}
    header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
    h1{margin:0;font-size:24px}
    .muted{color:#666}
    .box{border:1px solid #e5e5e5;border-radius:12px;padding:16px;margin-top:16px}
    input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px}
    ul{list-style:none;padding:0;margin:12px 0 0 0}
    li{padding:10px 8px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;gap:12px;align-items:center}
    li:last-child{border-bottom:none}
    a{color:#0b57d0;text-decoration:none}
    a:hover{text-decoration:underline}
    .tag{font-size:12px;color:#444;background:#f3f6ff;border:1px solid #d9e3ff;padding:2px 8px;border-radius:999px}
    .err{color:#b00020}
  </style>
</head>
<body>
  <header>
    <h1>Páginas do repositório</h1>
    <div class="muted" id="repoLabel"></div>
  </header>

  <div class="box">
    <div class="muted">Pesquisar:</div>
    <input id="q" placeholder="Digite parte do nome (ex: relatorio, pro_social, vacinas...)" />
    <div id="status" class="muted" style="margin-top:10px"></div>
    <ul id="list"></ul>
  </div>

  <div class="box">
    <div class="muted">
      Dica: coloque este <b>index.html</b> na raiz do repositório (ou na pasta que você publica no Pages).
    </div>
  </div>

<script>
/** ✅ Ajuste aqui **/
const OWNER = "wasjediknight";   // ex: "washingtonalmeida"
const REPO  = "secbe";      // ex: "relatorios-pro-social"

/**
 * Opcional: se suas páginas ficam em uma subpasta publicada (ex: /docs),
 * defina BASE_PATH = "docs". Se for raiz, deixe "".
 */
const BASE_PATH = ""; // ex: "docs"

/** Fallback manual (se a API falhar) — adicione nomes de arquivos .html */
const FALLBACK_PAGES = [
  // "dashboard_cbhpm_variedade_gap.html",
  // "dashboard_interativo_CBHPM_TUSS.html",
  // "relatorio_imunizantes_por_estado.html",
];

const repoLabel = document.getElementById("repoLabel");
repoLabel.textContent = `${OWNER}/${REPO}`;

const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");
const qEl = document.getElementById("q");

function toPagesUrl(path) {
  // GitHub Pages base:
  // https://OWNER.github.io/REPO/(BASE_PATH)/arquivo.html
  const base = `https://${OWNER}.github.io/${REPO}/` + (BASE_PATH ? `${BASE_PATH.replace(/^\/|\/$/g,"")}/` : "");
  return base + path.replace(/^\/+/,"");
}

function render(items) {
  listEl.innerHTML = "";
  if (!items.length) {
    listEl.innerHTML = `<li><span class="err">Nenhuma página encontrada.</span></li>`;
    return;
  }
  for (const it of items) {
    const li = document.createElement("li");
    li.innerHTML = `
      <div>
        <a href="${it.url}">${it.name}</a>
        <div class="muted" style="font-size:12px">${it.path}</div>
      </div>
      <span class="tag">HTML</span>
    `;
    listEl.appendChild(li);
  }
}

function filterAndRender(all) {
  const q = (qEl.value || "").trim().toLowerCase();
  const filtered = !q ? all : all.filter(x =>
    x.name.toLowerCase().includes(q) || x.path.toLowerCase().includes(q)
  );
  render(filtered);
}

async function fetchRepoHtmlFiles() {
  // Lista o conteúdo de uma pasta (root ou BASE_PATH) usando GitHub API.
  // Observação: a API só lista 1 nível. Se você tem subpastas com HTML,
  // você pode repetir para cada pasta (ou manter tudo no mesmo nível).
  const apiPath = BASE_PATH ? `contents/${BASE_PATH.replace(/^\/|\/$/g,"")}` : "contents";
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/${apiPath}`;

  const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" }});
  if (!res.ok) throw new Error(`GitHub API falhou (${res.status})`);

  const data = await res.json();
  if (!Array.isArray(data)) throw new Error("Resposta inesperada da API.");

  // Filtra HTML
  const html = data
    .filter(x => x.type === "file" && x.name.toLowerCase().endsWith(".html"))
    .filter(x => x.name.toLowerCase() !== "index.html") // não lista o próprio index
    .map(x => ({
      name: x.name,
      path: x.path,
      url: toPagesUrl(x.name) // link pro Pages (arquivo no mesmo nível)
    }))
    .sort((a,b) => a.name.localeCompare(b.name, "pt-BR"));

  return html;
}

async function init() {
  statusEl.textContent = "Carregando páginas do repositório...";
  let pages = [];
  try {
    pages = await fetchRepoHtmlFiles();
    statusEl.textContent = pages.length
      ? `Encontradas ${pages.length} página(s).`
      : "Nenhuma página .html encontrada (além do index).";
  } catch (e) {
    // fallback manual
    statusEl.innerHTML = `<span class="err">Não consegui listar automaticamente (API). Usando lista manual.</span>`;
    pages = (FALLBACK_PAGES || []).map(name => ({
      name,
      path: (BASE_PATH ? `${BASE_PATH.replace(/^\/|\/$/g,"")}/` : "") + name,
      url: toPagesUrl(name)
    }));
  }

  qEl.addEventListener("input", () => filterAndRender(pages));
  filterAndRender(pages);
}

init();
</script>
</body>
</html>
