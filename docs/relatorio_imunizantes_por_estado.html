  function escapeHtml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function renderTotals(key) {
    const rows = (DATASET[key] && DATASET[key].totals) ? DATASET[key].totals : [];
    let html = '<table class="tbl"><thead><tr>' +
      '<th>Imunizante</th><th>Indicação</th><th class="num">Aptos</th>' +
      '</tr></thead><tbody>';

    for (const r of rows) {
      html += '<tr>' +
        '<td>' + escapeHtml(r["Imunizante"]) + '</td>' +
        '<td>' + escapeHtml(r["Indicação"]) + '</td>' +
        '<td class="num">' + escapeHtml(r["Aptos"]) + '</td>' +
      '</tr>';
    }

    html += '</tbody></table>';
    document.getElementById("totalsContainer").innerHTML = html;
  }

  function renderBreakdown(key) {
    const rows = (DATASET[key] && DATASET[key].breakdown) ? DATASET[key].breakdown : [];
    let html = '<table class="tbl"><thead><tr>' +
      '<th>Unidade</th><th>Imunizante</th><th>Indicação</th><th class="num">Aptos</th>' +
      '</tr></thead><tbody>';

    for (const r of rows) {
      html += '<tr>' +
        '<td>' + escapeHtml(r["FILIAL_NOME"]) + '</td>' +
        '<td>' + escapeHtml(r["Imunizante"]) + '</td>' +
        '<td>' + escapeHtml(r["Indicação"]) + '</td>' +
        '<td class="num">' + escapeHtml(r["Aptos"]) + '</td>' +
      '</tr>';
    }

    html += '</tbody></table>';
    document.getElementById("breakdownContainer").innerHTML = html;
  }

  function refresh() {
    const key = document.getElementById("ufSelect").value || "ALL";
    renderTotals(key);
    renderBreakdown(key);
  }

  document.getElementById("ufSelect").addEventListener("change", refresh);
  refresh();
</script>
